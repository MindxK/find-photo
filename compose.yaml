services:
  findface:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      FIND_FACE_DATA: /data
      FIND_FACE_PORT: "8765"
      FIND_FACE_MODEL: buffalo_sc
    volumes:
      - findface-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=5).close()"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  findface-data:
