<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ · FindFace</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/styles.css"><script src="/static/login.js" defer></script></head>
<body class="auth-page"><main class="auth-card"><a class="brand" href="/login"><img src="/static/favicon.svg" width="42" height="42" alt=""><span>findface<span class="brand-dot">.</span></span></a><div class="eyebrow">YOUR PRIVATE PHOTO SPACE</div><h1 id="title">ค้นหาทุกรูปที่มีคุณ</h1><p id="description">เข้าสู่พื้นที่ส่วนตัวของคุณ แล้วเชื่อมต่อ Google Drive เพื่อเริ่มค้นหารูปด้วยใบหน้า</p><form id="auth-form"><label for="username">ชื่อบัญชี</label><input class="input" id="username" name="username" autocomplete="username" pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]{2,39}" minlength="3" maxlength="40" placeholder="เช่น mindx" required><label for="password">รหัสผ่าน</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" placeholder="อย่างน้อย 12 ตัวอักษร" required><div id="code-field" hidden><label for="code">รหัสเชิญ</label><input class="input" id="code" maxlength="200" autocomplete="off"></div><p id="error" class="notice error" role="alert" hidden></p><button class="button full" type="submit" id="submit">เข้าสู่ระบบ</button></form><button class="button ghost full" id="switch" type="button">มีรหัสเชิญ? สร้างบัญชีใหม่</button><div class="auth-note">แต่ละบัญชีมีโปรไฟล์ใบหน้า อัลบั้ม และ Google Drive แยกกัน<br>ประมวลผลบนเซิร์ฟเวอร์ของผู้ดูแล · ไม่เก็บภาพต้นฉบับ</div></main></body></html>
